name: Publish Miyabi image

# 只由 release.yml 调用；构建并推送镜像，不创建 Release。
on:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v (for example 0.4.18)
        required: true
        type: string
      ref:
        description: Git ref to build; release passes the tag
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ppxb/miyabi

jobs:
  build:
    name: Warm cache (${{ matrix.suffix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Warm cache [${{ matrix.platform }}]
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=miyabi-${{ matrix.suffix }}
          cache-to: type=gha,scope=miyabi-${{ matrix.suffix }},mode=max
          provenance: false
          sbom: false

  publish:
    name: Build and push multi-arch image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version '$VERSION'" >&2
            exit 1
          fi

          major="${VERSION%%.*}"
          rest="${VERSION#*.}"
          minor="${rest%%.*}"

          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${VERSION}"
            echo "${IMAGE_NAME}:${major}.${minor}"
            echo "${IMAGE_NAME}:${major}"
            echo "${IMAGE_NAME}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Miyabi
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=miyabi-amd64
            type=gha,scope=miyabi-arm64
          provenance: false
          sbom: false
