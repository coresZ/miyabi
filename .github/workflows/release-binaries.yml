name: Release Windows / Linux binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          # 需要 arm64 时取消下面注释
          # - name: windows-arm64
          #   goos: windows
          #   goarch: arm64
          #   ext: .exe
          # - name: linux-arm64
          #   goos: linux
          #   goarch: arm64
          #   ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o "miyabi${{ matrix.ext }}" \
            ./cmd/miyabi

      - name: Package Windows
        if: matrix.goos == 'windows'
        run: |
          mkdir -p "dist/miyabi-${{ matrix.name }}"
          cp "miyabi.exe" "dist/miyabi-${{ matrix.name }}/"

          # 强制 CRLF，避免 Windows cmd 把 bat 拆坏
          printf '%s\r\n' \
            '@echo off' \
            'chcp 65001 >nul' \
            'title Miyabi' \
            'set "MIYABI_ACCESS_PASSWORD=change-me"' \
            'set "MIYABI_DATA_DIR=%~dp0data"' \
            'set "MIYABI_LISTEN=:8080"' \
            'set "MIYABI_PUBLIC_URL=http://127.0.0.1:8080"' \
            'set "MIYABI_LOG_LEVEL=info"' \
            'echo.' \
            'echo Miyabi starting...' \
            'echo Browser: http://127.0.0.1:8080' \
            'echo Password: change-me' \
            'echo Data: %MIYABI_DATA_DIR%' \
            'echo.' \
            '"%~dp0miyabi.exe"' \
            'if errorlevel 1 pause' \
            > "dist/miyabi-${{ matrix.name }}/start.bat"

          printf '%s\r\n' \
            'Miyabi local (Windows)' \
            '' \
            '1. Double-click start.bat' \
            '2. Open http://127.0.0.1:8080' \
            '3. Default password: change-me (edit start.bat to change)' \
            '' \
            'Data is stored in the data folder. Do not delete it.' \
            > "dist/miyabi-${{ matrix.name }}/README.txt"

          cd dist
          zip -r "../miyabi-${{ matrix.name }}.zip" "miyabi-${{ matrix.name }}"

      - name: Package Linux
        if: matrix.goos == 'linux'
        run: |
          mkdir -p "dist/miyabi-${{ matrix.name }}"
          cp miyabi "dist/miyabi-${{ matrix.name }}/"

          cat > "dist/miyabi-${{ matrix.name }}/start.sh" << 'EOF'
          #!/bin/bash
          set -e
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export MIYABI_ACCESS_PASSWORD="${MIYABI_ACCESS_PASSWORD:-change-me}"
          export MIYABI_DATA_DIR="${MIYABI_DATA_DIR:-$DIR/data}"
          export MIYABI_LISTEN="${MIYABI_LISTEN:-:8080}"
          export MIYABI_PUBLIC_URL="${MIYABI_PUBLIC_URL:-http://127.0.0.1:8080}"
          export MIYABI_LOG_LEVEL="${MIYABI_LOG_LEVEL:-info}"
          echo "Miyabi starting..."
          echo "Open http://127.0.0.1:8080  password: change-me"
          exec "$DIR/miyabi"
          EOF

          chmod +x "dist/miyabi-${{ matrix.name }}/miyabi" \
                   "dist/miyabi-${{ matrix.name }}/start.sh"

          tar -C dist -czf "miyabi-${{ matrix.name }}.tar.gz" "miyabi-${{ matrix.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miyabi-${{ matrix.name }}
          path: |
            miyabi-*.zip
            miyabi-*.tar.gz
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: find artifacts -type f -ls

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
