name: Release Windows / Linux binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o "miyabi${{ matrix.ext }}" \
            ./cmd/miyabi

      - name: Package Windows (解压即用)
        if: matrix.goos == 'windows'
        run: |
          mkdir -p "dist/miyabi-${{ matrix.name }}"
          cp miyabi.exe "dist/miyabi-${{ matrix.name }}/"

          cat > "dist/miyabi-${{ matrix.name }}/start.bat" << 'EOF'
          @echo off
          chcp 65001 >nul
          title Miyabi
          set MIYABI_ACCESS_PASSWORD=change-me
          set MIYABI_DATA_DIR=%~dp0data
          set MIYABI_LISTEN=:8080
          set MIYABI_PUBLIC_URL=http://127.0.0.1:8080
          set MIYABI_LOG_LEVEL=info

          echo.
          echo  Miyabi 正在启动...
          echo  浏览器打开: http://127.0.0.1:8080
          echo  默认密码: change-me  （请尽快修改 start.bat）
          echo  数据目录: %~dp0data
          echo.
          miyabi.exe
          pause
          EOF

          cat > "dist/miyabi-${{ matrix.name }}/使用说明.txt" << 'EOF'
          Miyabi 本地版（Windows）

          1. 双击 start.bat 启动
          2. 浏览器访问 http://127.0.0.1:8080
          3. 默认访问密码：change-me（请立刻改掉）

          数据、图片缓存、Emby STRM 全部保存在 data 文件夹。
          不要删除 data，否则会丢失库记录。

          修改密码/端口：用记事本编辑 start.bat 里的环境变量即可。
          EOF

          cd dist
          zip -r "../miyabi-${{ matrix.name }}.zip" "miyabi-${{ matrix.name }}"

      - name: Package Linux
        if: matrix.goos == 'linux'
        run: |
          mkdir -p "dist/miyabi-${{ matrix.name }}"
          cp miyabi "dist/miyabi-${{ matrix.name }}/"

          cat > "dist/miyabi-${{ matrix.name }}/start.sh" << 'EOF'
          #!/bin/bash
          export MIYABI_ACCESS_PASSWORD="${MIYABI_ACCESS_PASSWORD:-change-me}"
          export MIYABI_DATA_DIR="$(cd "$(dirname "$0")" && pwd)/data"
          export MIYABI_LISTEN="${MIYABI_LISTEN:-:8080}"
          export MIYABI_PUBLIC_URL="${MIYABI_PUBLIC_URL:-http://127.0.0.1:8080}"
          export MIYABI_LOG_LEVEL="${MIYABI_LOG_LEVEL:-info}"
          echo "Miyabi 启动中... 访问 http://127.0.0.1:8080  密码: change-me"
          exec ./miyabi
          EOF

          chmod +x "dist/miyabi-${{ matrix.name }}/miyabi" \
                   "dist/miyabi-${{ matrix.name }}/start.sh"
          tar -C dist -czf "miyabi-${{ matrix.name }}.tar.gz" "miyabi-${{ matrix.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miyabi-${{ matrix.name }}
          path: |
            miyabi-*.zip
            miyabi-*.tar.gz
          if-no-files-found: error

  # ========== 桌面版（Wails，仅 Windows）==========
  build-desktop:
    name: Build miyabi-desktop (windows-amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Wails is resolved here only; the repository's go.mod stays Wails-free so
      # the console and Docker builds never need it.
      - name: Resolve Wails dependency
        run: |
          go get github.com/wailsapp/wails/v2@v2.15.0
          go mod tidy

      # Manual build (see DESKTOP_PLAN.md §11): the Wails CLI expects the main
      # package at the project root, while the desktop entry lives in
      # ./cmd/miyabi-desktop. This matches the Wails production build flags.
      - name: Build desktop binary
        env:
          CGO_ENABLED: "0"
        shell: pwsh
        run: |
          go build -tags "miyabidesktop desktop production" -trimpath `
            -ldflags "-w -s -H windowsgui" `
            -o miyabi-desktop.exe ./cmd/miyabi-desktop
          if (-not (Test-Path "miyabi-desktop.exe")) {
            throw "miyabi-desktop.exe was not produced"
          }

      - name: Package desktop (解压即用)
        shell: pwsh
        run: |
          $target = "dist/miyabi-desktop-windows-amd64"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "miyabi-desktop.exe" "$target/miyabi-desktop.exe"

          $readme = @"
          Miyabi Desktop

          1. Unzip to any folder
          2. Double-click miyabi-desktop.exe
          3. Data folder: .\data (auto-created)
          4. Optional: set MIYABI_ACCESS_PASSWORD before start

          Do not delete the data folder if you want to keep library state.
          Console edition zip is separate; both can share the same data folder
          if pointed to the same path (do not run both at once).
          "@
          Set-Content -Path "$target/README.txt" -Value $readme -Encoding UTF8

          Compress-Archive -Path $target -DestinationPath "miyabi-desktop-windows-amd64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miyabi-desktop-windows-amd64
          path: miyabi-desktop-windows-amd64.zip
          if-no-files-found: error

  # ========== 关键：挂到 GitHub Release ==========
  release:
    name: Attach to GitHub Release
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    # 只有打 tag 时才执行（手动 workflow_dispatch 不会走这里）
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files to upload
        run: ls -lah artifacts/

      - name: Attach binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          # 使用当前 tag
          tag_name: ${{ github.ref_name }}
          # 如果 Release 还不存在就创建，已存在就追加文件
          draft: false
          prerelease: false
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
