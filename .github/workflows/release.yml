name: Release

# 正式发版（与 Manual Build 分工明确）：
# - Actions 选分支 → 填版本号 → 勾选组件 → 打 tag + GitHub Release + 上传产物
# - 或：git push origin v0.4.20  → 按 tag 全量发版（桌面 + 便携包 + Docker）
#
# 只想验证构建、不要 tag/Release：请用「Manual Build」。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（必填，如 0.4.20）。将创建 tag v0.4.20 并发布 Release"
        required: true
        type: string
      desktop:
        description: "Windows 桌面（Tauri 安装包 + 便携 zip）"
        required: true
        type: boolean
        default: true
      portable:
        description: "服务端/浏览器便携包（无桌面窗口）"
        required: true
        type: boolean
        default: true
      docker:
        description: "构建并推送 Docker 镜像"
        required: true
        type: boolean
        default: false
      prerelease:
        description: "标记为 pre-release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Resolve version / tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      ref: ${{ steps.meta.outputs.ref }}
      want_desktop: ${{ steps.meta.outputs.want_desktop }}
      want_portable: ${{ steps.meta.outputs.want_portable }}
      want_docker: ${{ steps.meta.outputs.want_docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          short="${sha:0:7}"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            want_desktop=true
            want_portable=true
            want_docker=true
            tag="${{ github.ref_name }}"
            version="${tag#v}"
            ref="$tag"
          else
            want_desktop="${{ inputs.desktop }}"
            want_portable="${{ inputs.portable }}"
            want_docker="${{ inputs.docker }}"
            raw="${{ inputs.version }}"
            raw="${raw#v}"
            raw="$(echo "$raw" | xargs)"
            if [[ -z "$raw" ]]; then
              echo "::error::请填写版本号（例如 0.4.20）。仅构建请用 Manual Build。" >&2
              exit 1
            fi
            if [[ ! "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::版本号无效 '$raw'" >&2
              exit 1
            fi
            version="$raw"
            tag="v${version}"
            ref="$tag"

            if git rev-parse "$tag" >/dev/null 2>&1; then
              existing=$(git rev-parse "$tag^{commit}")
              if [[ "$existing" != "$sha" ]]; then
                echo "::error::Tag $tag 已存在且指向其他提交 ($existing)" >&2
                exit 1
              fi
              echo "Tag $tag 已在当前提交"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$tag" -m "Release $tag"
              git push origin "refs/tags/$tag"
              echo "Created tag $tag ($short)"
            fi
          fi

          if [[ "$want_desktop" != "true" && "$want_portable" != "true" && "$want_docker" != "true" ]]; then
            echo "::error::请至少勾选一个组件" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "ref=$ref"
            echo "want_desktop=$want_desktop"
            echo "want_portable=$want_portable"
            echo "want_docker=$want_docker"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag desktop=$want_desktop portable=$want_portable docker=$want_docker"

  create-draft:
    name: Create draft release
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release '$TAG' already exists"
            exit 0
          fi
          {
            echo "Miyabi ${VERSION}"
            echo
            echo "Built by GitHub Actions Release workflow."
          } > "$RUNNER_TEMP/release-notes.md"
          extra=()
          if [[ "$PRERELEASE" == "true" ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft \
            "${extra[@]}"

  desktop:
    name: Desktop
    needs: [version, create-draft]
    if: needs.version.outputs.want_desktop == 'true'
    uses: ./.github/workflows/desktop-tauri.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ needs.version.outputs.ref }}
      upload_release: true

  portable:
    name: Server portable
    needs: [version, create-draft]
    if: needs.version.outputs.want_portable == 'true'
    uses: ./.github/workflows/windows-portable.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ needs.version.outputs.ref }}
      upload_release: true

  docker:
    name: Docker
    needs: [version]
    if: needs.version.outputs.want_docker == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.ref }}
      push: true

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, create-draft, desktop, portable, docker]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.create-draft.result == 'success' &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') &&
      (needs.portable.result == 'success' || needs.portable.result == 'skipped') &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    steps:
      - name: Undraft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [[ "$state" == "true" ]]; then
            gh release edit "$TAG" --draft=false --repo "$GH_REPO"
          else
            echo "release '$TAG' already published"
          fi
