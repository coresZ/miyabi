name: Release

# 手动发布：先创建 tag，再在这里选择本次要发布的组件。
# 只有本工作流创建/发布 Release；各构建工作流只上传自己的产物。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example v0.4.18)'
        required: true
        type: string
      desktop:
        description: 'Build Windows desktop installer + portable zip'
        required: true
        type: boolean
        default: true
      portable:
        description: 'Build browser portable zips'
        required: true
        type: boolean
        default: true
      docker:
        description: 'Build and push the Docker image'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve and validate release
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag }}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag '$tag' (expected e.g. v1.2.3)" >&2
            exit 1
          fi

          if [[ "${{ inputs.desktop }}" != "true" && "${{ inputs.portable }}" != "true" && "${{ inputs.docker }}" != "true" ]]; then
            echo "::error::Select at least one component to release" >&2
            exit 1
          fi

          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: version
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: -vv --current
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

  create-draft:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: [version, changelog]
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_BODY: ${{ needs.changelog.outputs.release_body }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release '$TAG' already exists; keeping its body"
            exit 0
          fi

          printf '%s\n' "$RELEASE_BODY" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" \
            --verify-tag \
            --title "Release $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft

  desktop:
    name: Build desktop packages
    needs: [version, create-draft]
    if: inputs.desktop
    uses: ./.github/workflows/desktop-tauri.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ inputs.tag }}
      upload_release: true

  portable:
    name: Build portable packages
    needs: [version, create-draft]
    if: inputs.portable
    uses: ./.github/workflows/windows-portable.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ inputs.tag }}
      upload_release: true

  docker:
    name: Build and push Docker image
    needs: [version]
    if: inputs.docker
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ inputs.tag }}

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, create-draft, desktop, portable, docker]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.create-draft.result == 'success' &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') &&
      (needs.portable.result == 'success' || needs.portable.result == 'skipped') &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    steps:
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [[ "$state" == "true" ]]; then
            gh release edit "$TAG" --draft=false --repo "$GH_REPO"
          else
            echo "release '$TAG' is already published"
          fi
