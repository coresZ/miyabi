name: Release

# 正式发布：
# 1) 在 Actions 里选择分支（源码来自该分支当前 HEAD）
# 2) 填写版本号（如 0.4.20）→ 自动打 tag v0.4.20 并创建 GitHub Release
# 3) 勾选要发布的组件并构建上传
#
# 与「Manual Build」的区别：本流程会打 tag、写 Release；构建内容来自所选分支 HEAD。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (for example 0.4.20). Tag v0.4.20 will be created on the selected branch HEAD.'
        required: true
        type: string
      desktop:
        description: 'Build Windows desktop installer + portable zip'
        required: true
        type: boolean
        default: true
      portable:
        description: 'Build browser portable zips'
        required: true
        type: boolean
        default: true
      docker:
        description: 'Build and push the Docker image'
        required: true
        type: boolean
        default: false
      prerelease:
        description: 'Mark GitHub Release as prerelease'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Create tag on branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate and tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          # allow optional leading v
          version="${version#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$version' (expected e.g. 0.4.20 or 0.4.20-beta.1)" >&2
            exit 1
          fi

          if [[ "${{ inputs.desktop }}" != "true" && "${{ inputs.portable }}" != "true" && "${{ inputs.docker }}" != "true" ]]; then
            echo "::error::Select at least one component to release" >&2
            exit 1
          fi

          tag="v${version}"
          sha="${{ github.sha }}"
          branch="${{ github.ref_name }}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            existing=$(git rev-parse "$tag^{commit}")
            if [[ "$existing" != "$sha" ]]; then
              echo "::error::Tag $tag already points to $existing, not branch HEAD $sha ($branch). Move or delete the tag first." >&2
              exit 1
            fi
            echo "Tag $tag already on HEAD; reusing"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$sha" -m "Release $tag"
            git push origin "refs/tags/$tag"
            echo "Created tag $tag -> $sha on branch $branch"
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "sha=${sha}"
          } >> "${GITHUB_OUTPUT}"

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: version
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: -vv --current
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

  create-draft:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: [version, changelog]
    steps:
      - name: Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_BODY: ${{ needs.changelog.outputs.release_body }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release '$TAG' already exists; keeping its body"
            exit 0
          fi

          printf '%s\n' "$RELEASE_BODY" > "$RUNNER_TEMP/release-notes.md"
          extra=()
          if [[ "$PRERELEASE" == "true" ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "Release $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft \
            "${extra[@]}"

  desktop:
    name: Build desktop packages
    needs: [version, create-draft]
    if: inputs.desktop
    uses: ./.github/workflows/desktop-tauri.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ needs.version.outputs.tag }}
      upload_release: true

  portable:
    name: Build portable packages
    needs: [version, create-draft]
    if: inputs.portable
    uses: ./.github/workflows/windows-portable.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ needs.version.outputs.tag }}
      upload_release: true

  docker:
    name: Build and push Docker image
    needs: [version]
    if: inputs.docker
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.tag }}
      push: true

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, create-draft, desktop, portable, docker]
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.create-draft.result == 'success' &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') &&
      (needs.portable.result == 'success' || needs.portable.result == 'skipped') &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    steps:
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [[ "$state" == "true" ]]; then
            gh release edit "$TAG" --draft=false --repo "$GH_REPO"
          else
            echo "release '$TAG' is already published"
          fi
