name: Build desktop (Tauri)

# 与 windows-portable.yml（浏览器版便携包）和 docker-publish.yml 相互独立：
# 这里构建 Tauri 桌面端，产出 NSIS 安装包 + 便携 zip（miyabi.exe + runtime/）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 用于产物命名的版本号，留空使用 dev
        required: false
        default: dev
  push:
    branches:
      - 'feat/desktop-*'
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"

            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid version format: '$version' (expected e.g. 1.2.3)" >&2
              exit 1
            fi

            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            version="${{ inputs.version }}"
            echo "tag=" >> "${GITHUB_OUTPUT}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: version
    if: github.ref_type == 'tag'
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: -vv --current
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

  build:
    name: Build windows-x64
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # web/dist 必须存在：embed.go 内嵌它，缺少时 go build 会直接失败。
      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Go server
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/runtime | Out-Null
          # Bundled as a resource, so the installer nests it under runtime/
          # instead of dropping a second exe next to miyabi.exe.
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o "src-tauri/runtime/miyabi-server.exe" ./cmd

      - name: Build desktop app (installer)
        run: pnpm dlx @tauri-apps/cli@^2 build

      # The portable build gets its own identifier so it can run next to an
      # installed copy: single-instance and the webview profile stop colliding.
      - name: Build desktop app (portable shell)
        run: pnpm dlx @tauri-apps/cli@^2 build --no-bundle --config src-tauri/tauri.portable.conf.json

      - name: Assemble installers and portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = "miyabi-$env:VERSION-windows-x86_64-tauri"
          $stage = "dist/$package"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # `mainBinaryName = miyabi`: tauri-cli renames the shell binary, so the
          # installer and this portable zip both ship miyabi.exe.
          $shell = "src-tauri/target/release/miyabi.exe"
          if (-not (Test-Path $shell)) { throw "desktop shell was not produced: $shell" }
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $nsis) { throw 'the NSIS installer was not produced' }

          # Portable: the second build above, so the shell carries the portable
          # identifier. Sidecar and marker are shared with the installer build.
          Copy-Item $shell (Join-Path $stage 'miyabi.exe')
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'runtime') | Out-Null
          Copy-Item "src-tauri/runtime/miyabi-server.exe" (Join-Path $stage 'runtime/miyabi-server.exe')
          # Marker only. The installer has no such file, so the same exe can tell the two apart.
          New-Item -ItemType File -Force -Path (Join-Path $stage 'runtime/portable') | Out-Null
          Copy-Item LICENSE $stage
          Copy-Item docs/desktop-usage.md (Join-Path $stage '使用说明.md')
          $portableZip = "dist/$package-portable.zip"
          if (Test-Path $portableZip) { Remove-Item -Force $portableZip }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $portableZip
          Copy-Item $nsis.FullName "dist/$package-setup.exe"

      # archive:false 直接上传原文件。默认会再套一层 zip，下载名还不带扩展名。
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-tauri-setup.exe
          archive: false
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-tauri-portable.zip
          archive: false
          if-no-files-found: error

  publish:
    name: Attach packages to the release
    needs: [version, build, changelog]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: miyabi-*-windows-x86_64-tauri-*
          merge-multiple: true
          path: dist
          skip-decompress: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_BODY: ${{ needs.changelog.outputs.release_body }}
        run: |
          set -euo pipefail

          # docker-publish.yml 通常先建草稿；给它一点时间，避免重复创建。
          for attempt in $(seq 1 30); do
            if gh release view "${TAG}" >/dev/null 2>&1; then break; fi
            sleep 10
          done

          # 仍然没有就自己建，正文用 git-cliff 生成的发布日志，和 docker 工作流一致。
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            printf '%s\n' "${RELEASE_BODY}" > "${RUNNER_TEMP}/release-notes.md"
            gh release create "${TAG}" \
              --verify-tag \
              --title "Release ${TAG}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --draft
          fi

          gh release upload "${TAG}" dist/*-tauri-setup.exe dist/*-tauri-portable.zip --clobber
