name: Build desktop (Tauri)

# 与 windows-portable.yml（浏览器版便携包）和 docker-publish.yml 相互独立：
# 这里构建 Tauri 桌面端，产出 NSIS 安装包 + 便携 zip（壳 exe + Go sidecar）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 用于产物命名的版本号，留空使用 dev
        required: false
        default: dev
  push:
    branches:
      - 'feat/desktop-*'
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"

            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid version format: '$version' (expected e.g. 1.2.3)" >&2
              exit 1
            fi

            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            version="${{ inputs.version }}"
            echo "tag=" >> "${GITHUB_OUTPUT}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build windows-x64
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # web/dist 必须存在：embed.go 内嵌它，缺少时 go build 会直接失败。
      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Go sidecar
        shell: pwsh
        run: |
          $triple = (& rustc -vV | Select-String '^host:').Line.Split(' ')[1].Trim()
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          # Sidecar named "miyabi-server" so it never collides with the shell
          # "Miyabi.exe" on case-insensitive Windows filesystems.
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o "src-tauri/binaries/miyabi-server-$triple.exe" ./cmd
          "TRIPLE=$triple" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate icons
        run: |
          node scripts/gen-icon.mjs src-tauri/app-icon.png 1024
          pnpm dlx @tauri-apps/cli@^2 icon src-tauri/app-icon.png

      - name: Build desktop app (installer)
        run: pnpm dlx @tauri-apps/cli@^2 build

      - name: Assemble installers and portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = "miyabi-desktop-$env:VERSION-windows-x86_64"
          $stage = "dist/$package"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Cargo package name, not productName. productName only names the NSIS installer.
          $shell = "src-tauri/target/release/miyabi-desktop.exe"
          if (-not (Test-Path $shell)) { throw "desktop shell was not produced: $shell" }
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $nsis) { throw 'the NSIS installer was not produced' }

          # Portable: shell exe + Go sidecar (must sit next to each other) + license.
          Copy-Item $shell (Join-Path $stage 'Miyabi.exe')
          Copy-Item "src-tauri/binaries/miyabi-server-$env:TRIPLE.exe" (Join-Path $stage 'miyabi-server.exe')
          Copy-Item LICENSE $stage
          Copy-Item docs/desktop-usage.md (Join-Path $stage '使用说明.md')
          # Marker only. The installer has no such file, so the same exe can tell the two apart.
          New-Item -ItemType File -Force -Path (Join-Path $stage 'portable') | Out-Null
          if (Test-Path "dist/$package.zip") { Remove-Item -Force "dist/$package.zip" }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "dist/$package.zip"
          Copy-Item $nsis.FullName "dist/miyabi-desktop-$env:VERSION-setup.exe"

      # 两个产物分开上传：安装包(.exe) 与 便携版(.zip) 各自一个 artifact。
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: miyabi-desktop-windows-x86_64-setup
          path: dist/*-setup.exe
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: miyabi-desktop-windows-x86_64-portable
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Attach packages to the release
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: miyabi-desktop-windows-x86_64-*
          merge-multiple: true
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          # docker-publish.yml 会为同一个 tag 创建 Release 草稿；等它出现。
          for attempt in $(seq 1 30); do
            if gh release view "${TAG}" >/dev/null 2>&1; then break; fi
            sleep 10
          done

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::warning::release ${TAG} does not exist yet; the packages stay available as workflow artifacts"
            exit 0
          fi

          gh release upload "${TAG}" dist/* --clobber
