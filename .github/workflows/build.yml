name: Manual Build

# 验证/按需构建（不发版）：
# - Actions 选分支 = 用该分支最新代码
# - 勾选组件；只上传 workflow Artifact
# - 不打 tag、不创建 GitHub Release
#
# 正式发版请用「Release」。
on:
  workflow_dispatch:
    inputs:
      desktop:
        description: "Windows 桌面（Tauri：安装包 + 便携 zip）"
        required: true
        type: boolean
        default: true
      portable:
        description: "服务端/浏览器便携包（无桌面窗口）"
        required: true
        type: boolean
        default: true
      docker:
        description: "Docker 镜像（只构建不推送）"
        required: true
        type: boolean
        default: false
      version:
        description: "产物版本标签（留空 = 分支名-短sha）"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    name: Resolve build ref
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ github.ref }}"
          sha="${{ github.sha }}"
          short="${sha:0:7}"
          branch="${{ github.ref_name }}"
          label="${{ inputs.version }}"
          if [[ -z "$label" ]]; then
            safe=$(echo "$branch" | tr '/:' '--')
            label="${safe}-${short}"
          fi
          {
            echo "version=${label}"
            echo "ref=${ref}"
          } >> "${GITHUB_OUTPUT}"
          echo "branch=${branch} sha=${short} version=${label}"

  desktop:
    name: Desktop
    needs: resolve
    if: inputs.desktop
    uses: ./.github/workflows/desktop-tauri.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.ref }}
      upload_release: false

  portable:
    name: Server portable
    needs: resolve
    if: inputs.portable
    uses: ./.github/workflows/windows-portable.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.ref }}
      upload_release: false

  docker:
    name: Docker
    needs: resolve
    if: inputs.docker
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.ref }}
      push: false
